<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[QA] 제휴 연동 상품 & 제휴상품번호 조회</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-[1720px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-200 gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="px-2.5 py-1 text-xs font-bold bg-amber-500/10 text-amber-600 rounded-md border border-amber-200">QA Environment</span>
          <h1 class="text-2xl font-bold text-slate-900">[QA] 제휴 연동 상품 & 제휴상품번호 조회</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">100일 이내 재고 있는 연동 상품과 각 제휴사별 '제휴상품번호'를 실시간으로 조회합니다.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnFetchAll" onclick="fetchAllChannels()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-all shadow-sm shadow-blue-500/20 active:scale-95">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span>전체 채널 일괄 조회 (27개)</span>
        </button>
      </div>
    </header>

    <!-- Main Grid: 좌측 컨트롤 / 우측 결과 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Panel: 채널 선택 및 필터 (3 cols) -->
      <div class="lg:col-span-3 space-y-4">
        <!-- 제휴사 탭 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm">
          <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
            <i class="fa-solid fa-store text-blue-500"></i> 채널명(제휴사) 선택
          </h2>
          <div class="grid grid-cols-3 gap-2" id="partnerTabs">
            <!-- JS 동적 생성 -->
          </div>
        </div>

        <!-- 선택된 제휴사의 하위 채널 목록 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-list-check text-blue-500"></i>
              <span id="currentPartnerTitle">서비스명 목록</span>
            </h2>
            <button onclick="fetchCurrentPartnerChannels()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-bolt"></i> 이 제휴사만 조회
            </button>
          </div>
          <div id="channelList" class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
            <!-- JS 동적 생성 -->
          </div>
        </div>

        <!-- 직접 CHNL_ID 입력 조회 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm">
          <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-blue-500"></i> 채널ID 직접 입력 조회
          </h2>
          <div class="flex gap-2">
            <input type="text" id="customChnlId" placeholder="예: 0000018820" class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
            <button onclick="fetchCustomChannel()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm rounded-lg font-medium transition-all">
              조회
            </button>
          </div>
        </div>
      </div>

      <!-- Right Panel: 조회 결과 및 추출 (9 cols) -->
      <div class="lg:col-span-9 space-y-4">
        <!-- 상태 요약 바 -->
        <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4 text-sm flex-wrap">
            <div>
              <span class="text-[11px] text-slate-400 block font-medium">현재 조회 기준</span>
              <span id="currentScopeBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                <i class="fa-solid fa-crosshairs text-blue-500"></i>
                <span id="currentScopeText">조회 대기 (좌측 또는 상단 버튼 클릭)</span>
              </span>
            </div>
            <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
            <div>
              <span class="text-[11px] text-slate-400 block font-medium">조회된 채널</span>
              <span id="statChannelCount" class="font-bold text-slate-900 text-sm">0개</span>
            </div>
            <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
            <div>
              <span class="text-[11px] text-slate-400 block font-medium">조회된 상품 수</span>
              <span id="statItemCount" class="font-bold text-blue-600 text-sm">0건</span>
            </div>
            <div id="loadingIndicator" class="hidden items-center gap-2 text-blue-600 font-medium">
              <i class="fa-solid fa-circle-notch fa-spin"></i>
              <span id="loadingText" class="text-xs">조회 중...</span>
            </div>
          </div>

          <!-- 복사 및 내보내기 액션 -->
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="copyIds('ssg', 'newline')" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-all">
              <i class="fa-regular fa-copy text-blue-600"></i>
              <span>SSG상품번호 복사</span>
            </button>
            <button onclick="copyIds('allnco', 'newline')" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-semibold transition-all">
              <i class="fa-regular fa-copy text-indigo-600"></i>
              <span>제휴상품번호 복사</span>
            </button>
            <button onclick="exportCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold transition-all shadow-sm shadow-emerald-500/20">
              <i class="fa-solid fa-file-excel"></i>
              <span>CSV 다운로드 (지정양식)</span>
            </button>
          </div>
        </div>

        <!-- 검색 필터 -->
        <div class="flex items-center gap-3">
          <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="tableFilter" oninput="filterResultsTable()" placeholder="결과 필터링 (채널명, 서비스명, SSG상품번호, 제휴상품번호 검색)" class="w-full pl-9 pr-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <label class="flex items-center gap-2 text-xs text-slate-600 select-none cursor-pointer">
            <input type="checkbox" id="filterHasItemsOnly" onchange="filterResultsTable()" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span>상품 있는 채널만 보기</span>
          </label>
        </div>

        <!-- 결과 테이블 -->
        <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm overflow-hidden">
          <div class="max-h-[620px] overflow-y-auto overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse min-w-[1050px]">
              <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold sticky top-0 z-10 border-b border-slate-200">
                <tr>
                  <th onclick="handleSort('partner')" class="px-4 py-3.5 w-[120px] min-w-[120px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>채널명</span>
                      <i id="sort-icon-partner" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('channelName')" class="px-4 py-3.5 w-[180px] min-w-[180px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>서비스명</span>
                      <i id="sort-icon-channelName" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('ssgNo')" class="px-4 py-3.5 w-[170px] min-w-[170px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>SSG상품번호</span>
                      <i id="sort-icon-ssgNo" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('allncoNo')" class="px-4 py-3.5 w-[160px] min-w-[160px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>제휴상품번호</span>
                      <i id="sort-icon-allncoNo" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('shppMainCd')" class="px-4 py-3.5 w-[140px] min-w-[140px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>배송주체</span>
                      <i id="sort-icon-shppMainCd" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('storeInfo')" class="px-4 py-3.5 w-[190px] min-w-[190px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>영업점/사이트번호</span>
                      <i id="sort-icon-storeInfo" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th onclick="handleSort('modDts')" class="px-4 py-3.5 w-[180px] min-w-[180px] whitespace-nowrap cursor-pointer select-none hover:bg-slate-100 transition-colors group" title="클릭하여 정렬">
                    <div class="flex items-center justify-between">
                      <span>마지막연동일자</span>
                      <i id="sort-icon-modDts" class="fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500"></i>
                    </div>
                  </th>
                  <th class="px-3 py-3.5 w-[90px] min-w-[90px] text-center whitespace-nowrap">복사</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="8" class="px-4 py-16 text-center text-slate-400">
                    <div class="flex flex-col items-center justify-center gap-2">
                      <i class="fa-solid fa-box-open text-3xl text-slate-300"></i>
                      <p>좌측 채널 또는 상단 버튼을 클릭하면 해당 조건의 상품만 포커스되어 조회됩니다.</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm font-medium transform transition-all duration-300 translate-y-16 opacity-0 flex items-center gap-2 z-50">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">복사되었습니다!</span>
  </div>

  <script>
    const STORE_SITE_MAP = {
      // 영업점 번호
      "1002": "본점(1002)",
      "1003": "타임스퀘어점 리빙관(1003)",
      "1004": "강남점(1004)",
      "1006": "신세계 사우스시티점(1006)",
      "1007": "의정부점(1007)",
      "1008": "광주신세계(1008)",
      "1009": "센텀시티점(1009)",
      "1010": "마산점(1010)",
      "1011": "천안아산점(1011)",
      "1013": "타임스퀘어점 패션관(1013)",
      "1017": "김해점(1017)",
      "1018": "하남점(1018)",
      "1019": "대구신세계(1019)",
      "1020": "시코르강남역점(1020)",
      "1021": "팩토리스토어 강남점(1021)",
      "1022": "팩토리스토어 고양점(1022)",
      "1023": "온라인점 (S파트너스)(1023)",
      "1024": "대전신세계 (ART & SCIENCE)(1024)",
      "1026": "팩토리스토어 타임스퀘어점(1026)",
      "1027": "시코르닷컴(C3)(1027)",
      "1029": "신세계푸드마켓 도곡점(1029)",
      "1030": "신세계백화점 화장품 온라인점(배스앤바디웍스 온라인점)(1030)",
      "2551": "NE.O.004(2551)",
      // 사이트 번호
      "6001": "이마트몰(6001)",
      "6002": "트레이더스(6002)",
      "6004": "신세계몰(6004)",
      "7008": "아울렛(7008)"
    };

    const CHANNEL_DATA = [
      {
        partner: "G마켓",
        mainChnlId: "0000015780",
        channels: [
          { name: "신세계몰 (온라인)", chnlId: "0000015781" },
          { name: "신세계몰 (직매입)", chnlId: "0000016345" },
          { name: "신세계백화점", chnlId: "0000015782" },
          { name: "프리미엄아울렛", chnlId: "0000017105" },
          { name: "점포택배", chnlId: "0000018380" },
          { name: "장보기 (이마트몰/새벽배송)", chnlId: "0000018820" },
          { name: "장보기 (트레이더스)", chnlId: "0000023802" }
        ]
      },
      {
        partner: "옥션",
        mainChnlId: "0000015777",
        channels: [
          { name: "신세계몰 (온라인)", chnlId: "0000015778" },
          { name: "신세계몰 (직매입)", chnlId: "0000016346" },
          { name: "신세계백화점", chnlId: "0000015779" },
          { name: "프리미엄아울렛", chnlId: "0000017106" },
          { name: "점포택배", chnlId: "0000018381" }
        ]
      },
      {
        partner: "라이브쇼핑",
        mainChnlId: "0000019622",
        channels: [
          { name: "신세계몰", chnlId: "0000019624" },
          { name: "신세계백화점", chnlId: "0000019623" }
        ]
      },
      {
        partner: "11번가",
        mainChnlId: "0000015958",
        channels: [
          { name: "신세계몰", chnlId: "0000015959" },
          { name: "신세계백화점", chnlId: "0000015960" },
          { name: "프리미엄아울렛", chnlId: "0000017104" },
          { name: "장보기 (이마트몰/새벽배송)", chnlId: "0000020717" }
        ]
      },
      {
        partner: "네이버",
        mainChnlId: "0000016082",
        channels: [
          { name: "신세계백화점", chnlId: "0000016083" },
          { name: "점포택배", chnlId: "0000018560" },
          { name: "장보기 (이마트몰)", chnlId: "0000018200" },
          { name: "장보기 (새벽배송)", chnlId: "0000018201" },
          { name: "장보기 (트레이더스)", chnlId: "0000018202" }
        ]
      },
      {
        partner: "W컨셉",
        mainChnlId: "0000019089",
        channels: [
          { name: "신세계몰", chnlId: "0000019091" },
          { name: "신세계백화점", chnlId: "0000019090" }
        ]
      },
      {
        partner: "카카오",
        mainChnlId: "0000020537",
        channels: [
          { name: "신세계백화점", chnlId: "0000020540" }
        ]
      },
      {
        partner: "CTK",
        mainChnlId: "0000021953",
        channels: [
          { name: "신세계백화점", chnlId: "0000021954" }
        ]
      }
    ];

    let currentPartnerIdx = 0;
    let fetchedData = []; // { partner, channelName, chnlId, ssgNo, allncoNo, storeInfo, rawId, modDts }

    function parseLnkgItemId(rawId) {
      if (!rawId || rawId.length <= 4) return { ssgNo: rawId || "", storeInfo: "-" };
      const ssgNo = rawId.slice(0, -4);
      const suffix = rawId.slice(-4);
      const storeInfo = STORE_SITE_MAP[suffix] || suffix;
      return { ssgNo, storeInfo };
    }

    function initTabs() {
      const tabsEl = document.getElementById("partnerTabs");
      tabsEl.innerHTML = CHANNEL_DATA.map((p, idx) => `
        <button onclick="selectPartner(${idx})" id="tab-btn-${idx}" class="p-2 text-xs font-semibold rounded-lg border text-center transition-all ${idx === 0 ? 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
          ${p.partner}
          <span class="block text-[10px] text-slate-400 font-mono mt-0.5">${p.channels.length}개</span>
        </button>
      `).join("");
      selectPartner(0);
    }

    function selectPartner(idx) {
      currentPartnerIdx = idx;
      CHANNEL_DATA.forEach((_, i) => {
        const btn = document.getElementById(`tab-btn-${i}`);
        if (i === idx) {
          btn.className = "p-2 text-xs font-semibold rounded-lg border text-center transition-all bg-blue-50 border-blue-200 text-blue-700 shadow-sm";
        } else {
          btn.className = "p-2 text-xs font-semibold rounded-lg border text-center transition-all bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100";
        }
      });
      const partner = CHANNEL_DATA[idx];
      document.getElementById("currentPartnerTitle").textContent = `${partner.partner} 서비스명`;

      const listEl = document.getElementById("channelList");
      listEl.innerHTML = partner.channels.map(ch => `
        <div id="card-${ch.chnlId}" class="flex items-center justify-between p-2.5 rounded-lg border border-slate-200 hover:border-blue-300 hover:bg-blue-50/30 transition-all text-xs group">
          <div>
            <div class="font-medium text-slate-800">${ch.name}</div>
            <div class="text-[11px] text-slate-400 font-mono">${ch.chnlId}</div>
          </div>
          <button onclick="fetchSingleChannel('${partner.partner}', '${ch.name}', '${ch.chnlId}')" class="px-2.5 py-1 bg-white group-hover:bg-blue-600 group-hover:text-white border border-slate-200 group-hover:border-blue-600 text-slate-700 rounded text-xs font-semibold transition-all">
            조회
          </button>
        </div>
      `).join("");
    }

    function updateScopeBadge(text, kind = 'channel') {
      const txtEl = document.getElementById("currentScopeText");
      const badgeEl = document.getElementById("currentScopeBadge");
      txtEl.textContent = text;

      if (kind === 'all') {
        badgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-blue-600 text-white shadow-sm shadow-blue-500/20";
        badgeEl.querySelector("i").className = "fa-solid fa-earth-americas text-white";
      } else if (kind === 'partner') {

    // BO 제휴상품번호 조회 함수 (1. 로컬 프록시 /api/bo -> 2. BO 직접호출 -> 3. 내장 캐시 fallback)
    async function fetchBoAllncoItems(chnlId, ssgNos) {
      if (!ssgNos || ssgNos.length === 0) return {};
      const uniqueIds = Array.from(new Set(ssgNos));
      const mapping = {};

      // 1순위: 내장 캐시에서 기본값 먼저 매핑
      uniqueIds.forEach(id => {
        const key = chnlId + "_" + id;
        if (BUILTIN_ALLNCO_MAP[key]) {
          mapping[id] = BUILTIN_ALLNCO_MAP[key];
        } else if (BUILTIN_ALLNCO_MAP[id]) {
          mapping[id] = BUILTIN_ALLNCO_MAP[id];
        }
      });

      // 2순위: 로컬 프록시(/api/bo) 호출 시도
      try {
        const proxyUrl = '/api/bo';
        const params = new URLSearchParams({
          chnlId: chnlId,
          itemIds: uniqueIds.join(',')
        });
        const resp = await fetch(proxyUrl + "?" + params.toString(), { method: 'GET' });
        if (resp.ok) {
          const liveData = await resp.json();
          Object.assign(mapping, liveData);
          return mapping;
        }
      } catch (e) {
        // 프록시 미동작 시 fallback 유지
      }

      // 3순위: BO 직접 호출 (동일 오리진 또는 CORS 허용 환경)
      try {
        const url = 'https://qa-bo.ssgadm.com/cp/alln/allnItem/getAllncoItemLnkgMngList.ssg';
        const params = new URLSearchParams({
          userFlag: 'SUPER',
          quickSearchType: '1',
          search_item_id_txt: uniqueIds.join(','),
          searchItemIds: uniqueIds.join(','),
          searchItemRegDivCd: '',
          searchItemRegDtlCd: '',
          searchChnlId: chnlId,
          searchAllnAplYn: 'Y',
          page: '1',
          pageSize: '100'
        });

        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
            'is_dhx_griddata_req': 'true',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: params.toString(),
          credentials: 'include'
        });

        if (resp.ok) {
          const data = await resp.json();
          const rows = data.gridRows || [];
          rows.forEach(r => {
            const cells = r.gridCells || [];
            if (cells.length > 22) {
              const ssgId = cells[8]?.value;
              const allncoId = cells[22]?.value || '-';
              const lnkgId = cells[41]?.value;
              if (ssgId && allncoId !== '-') mapping[ssgId] = allncoId;
              if (lnkgId && allncoId !== '-') mapping[lnkgId] = allncoId;
            }
          });
        }
      } catch (err) {
        // 브라우저 CORS 차단 시 내장 캐시 매핑값 유지
      }

      return mapping;
    }

    // 채널명 및 영업점/사이트번호/상품번호 기반 배송주체 자동 판별 (지능형 Fallback)
    function getShppMainDisplay(channelName, storeInfo, ssgNo) {
      const ch = channelName || "";
      const st = storeInfo || "";
      const no = ssgNo || "";

      // 1. 점포택배 및 장보기 채널 -> 점포PP(21)
      if (ch.includes("점포택배") || ch.includes("장보기")) {
        return "점포PP(21)";
      }

      // 2. 백화점 개별 등록 상품 배송주체 (센터입고브랜드 13 / 직배 42)
      if (CENTER_BRAND_ITEMS.has(no)) {
        return "센터입고(13)";
      }
      if (DIRECT_BRAND_ITEMS.has(no)) {
        return "직배(42)";
      }

      // 3. 백화점 점포 중 PP입고 운영 점포 (김해점 1017 등)
      if (st.includes("김해점") || st.includes("1017")) {
        return "PP입고(12)";
      }

      // 4. 신세계백화점 일반 점포 매장 출고 -> 매장집하(11)
      if (ch.includes("신세계백화점") || ch.includes("백화점")) {
        return "매장집하(11)";
      }

      // 3. 프리미엄아울렛 -> 협력업체(41)
      if (ch.includes("아울렛")) {
        return "협력업체(41)";
      }

      // 4. 신세계몰 (직매입: 센터(13) / 온라인: 협력업체(41))
      if (ch.includes("신세계몰")) {
        if (ch.includes("직매입")) return "센터(13)";
        return "협력업체(41)";
      }

      // 5. 물류센터 / 새벽배송 등 센터 출고 -> 센터(13)
      if (ch.includes("직매입") || ch.includes("새벽배송")) {
        return "센터(13)";
      }

      // 6. 이마트몰 점포/사이트
      if (ch.includes("이마트몰")) {
        if (st.includes("2551") || st.includes("NE.O")) return "센터(13)";
        return "점포PP(21)";
      }

      // 7. 영업점/사이트번호 기준 보조 판별
      if (st.includes("점(") || /10[0-3][0-9]/.test(st)) return "매장집하(11)";
      if (st.includes("6004") || st.includes("7008")) return "협력업체(41)";
      if (st.includes("2551")) return "센터(13)";

      return "매장집하(11)";
    }

    // BO 배송정보관리 API(listItemShippForPaging.ssg) 호출하여 배송주체(shppMainCd) 맵핑
    async function fetchBoShppMainItems(ssgNos) {
      if (!ssgNos || ssgNos.length === 0) return {};
      const uniqueIds = Array.from(new Set(ssgNos));
      const mapping = {};

      // 1순위: 로컬 프록시(/api/shpp) 호출 시도
      try {
        const proxyUrl = '/api/shpp';
        const params = new URLSearchParams({ itemIds: uniqueIds.join(',') });
        const resp = await fetch(proxyUrl + "?" + params.toString(), { method: 'GET' });
        if (resp.ok) {
          const liveData = await resp.json();
          return liveData;
        }
      } catch (e) {}

      // 2순위: BO 직접 호출 (동일 오리진 또는 CORS 허용 환경)
      try {
        const url = 'https://qa-bo.ssgadm.com/cp/itemoper/itemShippMng/listItemShippForPaging.ssg';
        const params = new URLSearchParams({
          formVersion: '20170725',
          searchDtType: '1',
          search_start_dt_disp: '2025-01-01',
          searchStartDt: '20250101',
          search_end_dt_disp: '2026-12-31',
          searchEndDt: '20261231',
          set_date: '3',
          search_item_id_txt: uniqueIds.join(','),
          searchItemIds: uniqueIds.join(','),
          searchShppMainCd: '',
          page: '1',
          pageSize: '100'
        });

        const resp = await fetch(url + "?" + params.toString(), {
          method: 'GET',
          headers: {
            'accept': 'application/xml, text/xml, */*; q=0.01',
            'is_dhx_griddata_req': 'true',
            'x-requested-with': 'XMLHttpRequest'
          },
          credentials: 'include'
        });

        if (resp.ok) {
          const text = await resp.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, "application/xml");

          let itemIdIdx = null;
          let shppMainIdx = null;
          const cols = xmlDoc.querySelectorAll("head > column");
          cols.forEach((col, idx) => {
            const colId = (col.getAttribute("id") || "").toLowerCase();
            const colTxt = (col.textContent || "").trim();
            if (colId.includes("itemid") || colTxt.includes("상품번호")) itemIdIdx = idx;
            if (colId.includes("shppmain") || colTxt.includes("배송주체")) shppMainIdx = idx;
          });

          const rows = xmlDoc.querySelectorAll("row");
          rows.forEach(r => {
            const rId = r.getAttribute("id") || "";
            const cells = Array.from(r.querySelectorAll("cell")).map(c => (c.textContent || "").trim());
            if (cells.length === 0) return;

            let currId = "";
            if (itemIdIdx !== null && itemIdIdx < cells.length) {
              currId = cells[itemIdIdx];
            } else if (rId && uniqueIds.includes(rId)) {
              currId = rId;
            } else {
              for (const c of cells) {
                if (uniqueIds.includes(c)) { currId = c; break; }
              }
            }

            let currShpp = "";
            if (shppMainIdx !== null && shppMainIdx < cells.length) {
              currShpp = cells[shppMainIdx];
            } else {
              for (const c of cells) {
                if (SHPP_MAIN_MAP[c]) { currShpp = c; break; }
                for (const [code, desc] of Object.entries(SHPP_MAIN_MAP)) {
                  if (c === code || (c.length > 2 && desc.includes(c))) {
                    currShpp = code;
                    break;
                  }
                }
                if (currShpp) break;
              }
            }

            if (currId) {
              mapping[currId] = SHPP_MAIN_MAP[currShpp] || currShpp || "-";
            }
          });
        }
      } catch (err) {}

      return mapping;
    }

            chnlId,
            ssgNo: null,
            allncoNo: "-",
            shppMainCd: "-",
            storeInfo: "-",
            rawId: null,
            modDts: "-"
          });
        } else {
          // 1차 파싱 (배송주체 기본 판별 즉시 적용)
          const tempRows = items.map(it => {
            const { ssgNo, storeInfo } = parseLnkgItemId(it.lnkgItemId);

            return {
              partner,
              channelName,

              ssgNo,
              allncoNo: "-",
              shppMainCd: defaultShpp,
              storeInfo,
              rawId: it.lnkgItemId,

          showLoading(true, `[${channelName}] 제휴상품번호 & 배송주체 조회 중...`);
          const ssgNos = tempRows.map(r => r.ssgNo);
          const [boMap, shppMap] = await Promise.all([
            fetchBoAllncoItems(chnlId, ssgNos),
            fetchBoShppMainItems(ssgNos)
          ]);
          
          tempRows.forEach(r => {
            r.allncoNo = boMap[r.rawId] || boMap[r.ssgNo] || BUILTIN_ALLNCO_MAP[r.chnlId + "_" + r.ssgNo] || BUILTIN_ALLNCO_MAP[r.ssgNo] || "-";
            if (shppMap && shppMap[r.ssgNo] && shppMap[r.ssgNo] !== "-") {
              r.shppMainCd = shppMap[r.ssgNo];
            }
          });

          fetchedData = tempRows;
        }

        renderTable();
        showToast(`[${partner} > ${channelName}] 조회 완료 (${items.length}건)`);
      } catch (e) {
        alert(`조회 실패 (${chnlId}): ${e.message}`);
      } finally {
        showLoading(false);
      }
    }

    // 배송주체별 컬러셋 정의 (리스트 식별성 극대화)
    function getShppBadgeInfo(shpp) {
      if (!shpp || shpp === "-") {
        return {
          bg: "bg-slate-50 text-slate-400 border-slate-200",
          dot: "bg-slate-300"
        };
      }
      if (shpp.includes("11") || shpp.includes("매장집하")) {
        // 11 매장집하: 주황 / 앰버 톤 (오프라인 백화점 매장)
        return {
          bg: "bg-amber-50 text-amber-900 border-amber-300 ring-1 ring-amber-500/10",
          dot: "bg-amber-500"
        };
      }
      if (shpp.includes("12") || shpp.includes("PP입고")) {
        // 12 PP입고: 퍼플 / 바이올렛 톤 (백화점 점포 PP센터)
        return {
          bg: "bg-purple-50 text-purple-900 border-purple-300 ring-1 ring-purple-500/10",
          dot: "bg-purple-500"
        };
      }
      if (shpp.includes("13") || shpp.includes("센터")) {
        // 13 센터입고: 블루 / 스카이 톤 (물류센터 NE.O 입고)
        return {
          bg: "bg-blue-50 text-blue-900 border-blue-300 ring-1 ring-blue-500/10",
          dot: "bg-blue-500"
        };
      }
      if (shpp.includes("21") || shpp.includes("점포PP")) {
        // 21 점포PP: 에메랄드 / 그린 톤 (이마트몰/트레이더스 점포배송)
        return {
          bg: "bg-emerald-50 text-emerald-900 border-emerald-300 ring-1 ring-emerald-500/10",
          dot: "bg-emerald-500"
        };
      }
      if (shpp.includes("41") || shpp.includes("협력업체")) {
        // 41 협력업체: 슬레이트 / 그레이 톤 (외부 협력사 택배직송)
        return {
          bg: "bg-slate-100 text-slate-800 border-slate-300 ring-1 ring-slate-400/10",
          dot: "bg-slate-500"
        };
      }
      if (shpp.includes("42") || shpp.includes("직배")) {
        // 42 직배: 로즈 / 핑크 톤 (브랜드 직접 배송)
        return {
          bg: "bg-rose-50 text-rose-900 border-rose-300 ring-1 ring-rose-500/10",
          dot: "bg-rose-500"
        };
      }
      if (shpp.includes("14") || shpp.includes("15")) {
        // 14 백화점식품, 15 백화점점포PP: 틸 / 청록 톤
        return {
          bg: "bg-teal-50 text-teal-900 border-teal-300 ring-1 ring-teal-500/10",
          dot: "bg-teal-500"
        };
      }
      return {
        bg: "bg-gray-50 text-gray-800 border-gray-200",
        dot: "bg-gray-400"
      };
    }

    function renderShppBadge(shpp) {
      const info = getShppBadgeInfo(shpp);
      return `<span class="inline-flex items-center gap-1.5 font-mono text-xs font-semibold px-2.5 py-1 rounded-md border ${info.bg} shadow-sm"><span class="w-1.5 h-1.5 rounded-full ${info.dot}"></span><span>${shpp}</span></span>`;
    }

    function quickFilterShpp(val) {
      const input = document.getElementById("tableFilter");
      input.value = val;
      filterResultsTable();
    }


    // 테이블 정렬 상태 및 정렬 함수
    let currentSortCol = 'modDts';
    let currentSortDir = 'desc';

    function handleSort(col) {
      if (currentSortCol === col) {
        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortCol = col;
        currentSortDir = (col === 'modDts') ? 'desc' : 'asc';
      }
      renderTable();
    }

    function updateSortIcons() {
      const cols = ['partner', 'channelName', 'ssgNo', 'allncoNo', 'shppMainCd', 'storeInfo', 'modDts'];
      cols.forEach(col => {
        const el = document.getElementById(`sort-icon-${col}`);
        if (!el) return;
        if (currentSortCol === col) {
          el.className = currentSortDir === 'asc' 
            ? "fa-solid fa-arrow-up-long text-blue-600 text-xs" 
            : "fa-solid fa-arrow-down-long text-blue-600 text-xs";
        } else {
          el.className = "fa-solid fa-sort text-slate-300 text-xs group-hover:text-slate-500";
        }
      });
    }

    function renderTable() {
      const q = document.getElementById("tableFilter").value.trim().toLowerCase();
      const hasItemsOnly = document.getElementById("filterHasItemsOnly").checked;
      const tbody = document.getElementById("resultsTableBody");

      const uniqueChannels = new Set(fetchedData.map(d => d.chnlId));
      const validItems = fetchedData.filter(d => d.ssgNo !== null);
      
      document.getElementById("statChannelCount").textContent = `${uniqueChannels.size}개`;
      document.getElementById("statItemCount").textContent = `${validItems.length}건`;

      let filtered = fetchedData;
      if (hasItemsOnly) {
        filtered = filtered.filter(d => d.ssgNo !== null);
      }
      if (q) {
        filtered = filtered.filter(d => 
          (d.partner && d.partner.toLowerCase().includes(q)) ||
          (d.channelName && d.channelName.toLowerCase().includes(q)) ||
          (d.chnlId && d.chnlId.toLowerCase().includes(q)) ||
          (d.ssgNo && d.ssgNo.toLowerCase().includes(q)) ||
          (d.allncoNo && d.allncoNo.toLowerCase().includes(q)) ||
          (d.shppMainCd && d.shppMainCd.toLowerCase().includes(q)) ||
          (d.storeInfo && d.storeInfo.toLowerCase().includes(q)) ||
          (d.modDts && d.modDts.toLowerCase().includes(q))
        );
      }

      // 정렬 처리
      if (currentSortCol) {
        filtered.sort((a, b) => {
          if (a.ssgNo === null && b.ssgNo !== null) return 1;
          if (a.ssgNo !== null && b.ssgNo === null) return -1;

          let valA = a[currentSortCol];
          let valB = b[currentSortCol];

          if (valA === null || valA === undefined || valA === '-') valA = '';
          if (valB === null || valB === undefined || valB === '-') valB = '';

          if (!valA && !valB) return 0;
          if (!valA) return 1;
          if (!valB) return -1;

          let cmp = 0;
          if (currentSortCol === 'ssgNo' || currentSortCol === 'allncoNo') {
            const numA = Number(valA);
            const numB = Number(valB);
            if (!isNaN(numA) && !isNaN(numB)) {
              cmp = numA - numB;
            } else {
              cmp = String(valA).localeCompare(String(valB));
            }
          } else {
            cmp = String(valA).localeCompare(String(valB), 'ko');
          }

          return currentSortDir === 'asc' ? cmp : -cmp;
        });
      }

      updateSortIcons();

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="px-4 py-12 text-center text-slate-400">
              조회된 데이터가 없거나 필터 조건에 맞는 항목이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(row => {
        const hasItem = row.ssgNo !== null;
        const hasAllnco = hasItem && row.allncoNo && row.allncoNo !== "-";
        const hasShpp = hasItem && row.shppMainCd && row.shppMainCd !== "-";
        return `
          <tr class="hover:bg-slate-50/80 transition-colors ${!hasItem ? 'bg-slate-50/40 text-slate-400' : ''}">
            <td class="px-4 py-3 font-medium text-slate-800 whitespace-nowrap">${row.partner}</td>
            <td class="px-4 py-3 text-slate-700 whitespace-nowrap">${row.channelName}</td>
            <td class="px-4 py-3 whitespace-nowrap">
              ${hasItem ? `<span class="font-mono font-semibold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">${row.ssgNo}</span>` : '<span class="text-xs text-slate-400 italic">연동 상품 없음 (0건)</span>'}
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              ${hasAllnco ? `<span class="font-mono font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">${row.allncoNo}</span>` : `<span class="font-mono text-xs text-slate-400">-</span>`}
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              ${hasShpp ? renderShppBadge(row.shppMainCd) : `<span class="text-xs text-slate-400 font-mono">-</span>`}
            </td>
            <td class="px-4 py-3 font-medium text-xs text-slate-600 whitespace-nowrap">${hasItem ? row.storeInfo : '-'}</td>
            <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${row.modDts}</td>
            <td class="px-3 py-3 text-center whitespace-nowrap">
              ${hasItem ? `
                <div class="inline-flex items-center justify-center gap-1">
                  <button onclick="copySingle('${row.ssgNo}', 'SSG상품번호')" title="SSG상품번호 복사" class="p-1 px-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition-colors">
                    <i class="fa-regular fa-copy"></i>
                  </button>
                  ${hasAllnco ? `
                    <button onclick="copySingle('${row.allncoNo}', '제휴상품번호')" title="제휴상품번호 복사" class="p-1 px-1.5 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded transition-colors">
                      <i class="fa-solid fa-link text-[10px]"></i>
                    </button>
                  ` : ''}
                </div>
              ` : '-'}
            </td>
          </tr>
        `;
      }).join("");
    }

    function filterResultsTable() {
      renderTable();
    }

    function copySingle(val, label = "값") {
      navigator.clipboard.writeText(val).then(() => {
        showToast(`${label} [${val}] 복사 완료`);
      });
    }

    function copyIds(type = 'ssg', delimiter = 'newline') {
      const validRows = fetchedData.filter(d => d.ssgNo !== null);
      if (validRows.length === 0) {
        alert("복사할 데이터가 없습니다.");
        return;
      }

      let targetList = [];
      let label = "";

      if (type === 'allnco') {
        targetList = validRows
          .map(d => d.allncoNo)
          .filter(v => v && v !== "-");
        label = "제휴상품번호";
      } else {
        targetList = validRows.map(d => d.ssgNo);
        label = "SSG상품번호";
      }

      if (targetList.length === 0) {
        alert(`복사할 ${label}가 없습니다.`);
        return;
      }

      const uniqueIds = Array.from(new Set(targetList));
      const sep = delimiter === 'newline' ? '\n' : ', ';
      const text = uniqueIds.join(sep);

      navigator.clipboard.writeText(text).then(() => {
        showToast(`${uniqueIds.length}개 ${label} 복사 완료!`);
      });
    }

    function exportCSV() {
      const validRows = fetchedData.filter(d => d.ssgNo !== null);
      if (validRows.length === 0) {
        alert("내보낼 상품 데이터가 없습니다.");
        return;
      }

      // 지정 양식 헤더: 채널명,서비스명,채널ID,SSG상품번호,제휴상품번호,배송주체,영업점번호,마지막연동일자
      let csv = "\uFEFF채널명,서비스명,채널ID,SSG상품번호,제휴상품번호,배송주체,영업점번호,마지막연동일자\n";
      validRows.forEach(r => {
        const chnlIdCell = r.chnlId.startsWith('0') ? `=\"${r.chnlId}\"` : r.chnlId;
        const ssgNoCell = r.ssgNo.startsWith('0') ? `=\"${r.ssgNo}\"` : r.ssgNo;
        const allncoNo = r.allncoNo || "-";
        const allncoCell = allncoNo.startsWith('0') ? `=\"${allncoNo}\"` : allncoNo;
        const shppCell = r.shppMainCd || "-";
        csv += `"${r.partner}","${r.channelName}",${chnlIdCell},${ssgNoCell},${allncoCell},"${shppCell}","${r.storeInfo}","${r.modDts}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      a.href = url;
      a.download = `QA_제휴연동상품_${dateStr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initTabs();
    });
  </script>
</body>
</html>
